# Bei jedem Push auf main und bei jedem Pull Request: Tests, Security-Audit
# (nur high/critical), Production-Build.
name: audit + build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Security audit (high/critical only)
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build
